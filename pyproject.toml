[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cnc-program-analyzer"
version = "1.1.0"
description = "Local CNC G-code analyzer with job-packet Tool List validation and Excel process-sheet reporting"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.39,<2",
    "pandas>=2.0,<3",
    "openpyxl>=3.1,<4",
    "Pillow>=10,<13",
    "xlrd>=2.0,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
